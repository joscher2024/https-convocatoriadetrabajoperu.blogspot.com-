name: Actualizar convocatorias
on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/scrape.py
      - name: Guardar cambios
        run: |
          git config user.name "bot-empleos"
          git config user.email "bot@users.noreply.github.com"
          git add docs/jobs.json
          git diff --cached --quiet || (git commit -m "Actualiza convocatorias" && git push)
