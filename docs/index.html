<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Empleos del Estado · Convocatorias de trabajo en el sector público</title>
<meta name="description" content="Convocatorias de trabajo del sector público peruano: CAS, 728, prácticas y más. Filtra por carrera, contrato, departamento y nivel de estudios.">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#1d4ed8;--pri2:#1e40af;--soft:#e8f0fe;--tile:#eef3fb;--ok:#047857;--warn:#b45309;--okbg:#d1fae5;--warnbg:#fef3c7;--dng:#b91c1c;--dngbg:#fee2e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#111a2e;--ink:#e5ecf9;--mut:#93a3bf;--line:#223250;--pri:#60a5fa;--pri2:#93c5fd;--soft:#14264a;--tile:#13213d;--ok:#6ee7b7;--warn:#fcd34d;--okbg:#064e3b;--warnbg:#451a03;--dng:#fca5a5;--dngbg:#450a0a}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#111a2e;--ink:#e5ecf9;--mut:#93a3bf;--line:#223250;--pri:#60a5fa;--pri2:#93c5fd;--soft:#14264a;--tile:#13213d;--ok:#6ee7b7;--warn:#fcd34d;--okbg:#064e3b;--warnbg:#451a03;--dng:#fca5a5;--dngbg:#450a0a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 Inter,"Segoe UI",system-ui,Roboto,Arial,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.w{max-width:1180px;margin:0 auto;padding:0 16px}
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .w{display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;cursor:pointer}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-style:normal}
.logo small{display:block;font-size:.65rem;color:var(--mut);font-weight:600;letter-spacing:.5px;margin-top:-4px}
nav{display:flex;gap:4px;align-items:center;font-size:1rem;font-weight:600}
nav a{padding:8px 12px;border-radius:8px;color:var(--mut)}nav a:hover{background:var(--soft);color:var(--pri)}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.bc{font-size:.95rem;color:var(--mut);margin:18px 0 6px}.bc a{color:var(--pri);font-weight:600;cursor:pointer}
h1{font-size:clamp(1.7rem,4vw,2.4rem);margin:0 0 6px;line-height:1.2}
.lead{color:var(--mut);margin:0 0 16px;max-width:820px;font-size:1.02rem}
.filters{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:20px}
.filters h3{margin:0 0 12px;color:var(--pri);font-size:1.05rem}
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
label{display:block;font-size:.85rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
select,input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.05rem}
select:focus,input:focus{outline:2px solid var(--pri);outline-offset:1px}
.fr{display:flex;gap:10px;align-items:end;margin-top:12px;flex-wrap:wrap}
.fr .s{flex:1;min-width:200px}.fr .o{width:200px}
.btn{border:0;border-radius:12px;padding:13px 24px;font-size:1.05rem;font-weight:700;background:var(--pri);color:#fff}.btn:hover{background:var(--pri2)}
.btn.g{background:var(--card);color:var(--pri);border:1px solid var(--line)}
.layout{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;padding-bottom:36px}
.count{font-weight:700;margin-bottom:12px}.count span{color:var(--pri)}
.job{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;position:relative;transition:.15s}
.job:hover{box-shadow:0 10px 28px rgba(29,78,216,.12);border-color:var(--pri)}
.jh{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.pill{display:inline-block;font-size:.88rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--warnbg);color:var(--warn)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.off{background:var(--dngbg);color:var(--dng)}
.org{display:flex;align-items:center;gap:10px;margin:10px 0 4px}
.av{width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.org b{color:var(--pri);font-size:.95rem}
.job h2{font-size:1.4rem;margin:4px 0 8px;line-height:1.3}.job h2 a:hover{color:var(--pri)}
.req{color:var(--mut);font-size:1rem;margin:0 0 14px}
.bm{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.1rem}
.bm.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.t{background:var(--tile);border-radius:12px;padding:10px 12px}
.t small{display:block;font-size:.8rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.t b{font-size:1.15rem}.t.m b{color:var(--pri);font-size:1.3rem}
.jf{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.share{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--mut)}
.share a{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:.85rem;font-weight:800}
.share a:hover{background:var(--pri);color:#fff;border-color:var(--pri)}
.side{position:sticky;top:76px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--pri);border-radius:18px;overflow:hidden}
.sh{display:flex;gap:12px;align-items:center;padding:16px}
.sh i{width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-style:normal;font-size:1.2rem}
.sh b{display:block;color:var(--pri)}.sh small{color:var(--mut)}
.side a{display:flex;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line);font-size:1.02rem;cursor:pointer}
.side a:hover{background:var(--soft);color:var(--pri)}.side a span{color:var(--mut)}
.pag{display:flex;gap:6px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.pag button{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.pag button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--mut);padding:44px}
/* detail */
.d{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:860px;margin:0 auto 30px}
.d h1{margin:8px 0 12px;font-size:clamp(1.8rem,4.5vw,2.6rem);color:var(--ink)}
.d .ent{color:var(--pri);font-weight:700;font-size:1.1rem}
.key{background:var(--soft);border-radius:16px;padding:16px;margin:18px 0}
.key h4{margin:0 0 12px;font-size:.75rem;letter-spacing:1px;color:var(--pri);text-transform:uppercase}
.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kg div{font-size:.98rem;color:var(--mut)}.kg b{display:block;color:var(--ink);font-size:1.25rem}
.sec{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}
.sec h3{margin:0;padding:14px 18px;font-size:1.2rem;color:var(--pri);background:var(--tile)}
.sec .b{padding:16px 18px;font-size:1.08rem}.sec ul{margin:0;padding-left:18px}.sec li{margin:6px 0}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.98rem}
.dl{display:block;text-align:center;border:2px solid var(--pri);color:var(--pri);font-weight:700;border-radius:12px;padding:15px;margin:8px 0;font-size:1.1rem}.dl:hover{background:var(--pri);color:#fff}
footer{background:var(--card);border-top:1px solid var(--line);padding:26px 0;font-size:.98rem;color:var(--mut)}
footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.fg{grid-template-columns:1fr 1fr}.tiles,.kg{grid-template-columns:1fr 1fr}nav a{display:none}}
@media(max-width:520px){.fg{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><div class="w">
 <div class="logo" data-home="1"><i>E</i><div>Empleos del Estado<small>CONVOCATORIAS PÚBLICAS · PERÚ</small></div></div>
 <nav><a href="#">CAS</a><a href="#">Prácticas</a><a href="#">728</a><a href="#">Entidades</a><button class="ib" id="th" aria-label="Cambiar tema">🌓</button></nav>
</div></div>

<div class="w" id="app"></div>

<footer><div class="w"><div>© 2026 Empleos del Estado. Plataforma informativa sobre convocatorias del sector público peruano.</div><div>Se actualiza automáticamente · Confirma siempre la información en las bases oficiales</div></div></footer>

<script>
var CAR="ADMINISTRACION;ANTROPOLOGÍA;ARCHIVO;ARQUEOLOGÍA;ARQUITECTURA;BIBLIOTECOLOGÍA;BIOLOGÍA;CHOFER - CONDUCTOR;CIENCIAS MILITARES;CIENCIAS POLITICAS;COMPUTACION;COMUNICACIONES;CONTABILIDAD;DERECHO;DISEÑO GRÁFICO | AUDIOVISUAL;ECONOMIA | ING. ECONÓMICA;EDUCACION;ENFERMERIA;ESTADÍSTICA;FARMACIA | QUÍMICO FARMACEUTICO;FILOSOFÍA;FISIOTERAPIA Y REHABILITACION;GESTIÓN PÚBLICA;GINECOLOGIA;HISTORIA;INDUSTRIAS ALIMENTARIAS | ING. ALIMENTARIA;ING. AGROINDUSTRIAL;ING. AGRONÓMICA | AGRONOMIA;ING. AGRÍCOLA;ING. AMBIENTAL;ING. CIVIL;ING. DE MINAS;ING. DE SISTEMAS;ING. DE SOFTWARE;ING. DE TELECOMUNICACIONES | REDES;ING. DE TRANSPORTES;ING. ELECTRICA;ING. ELECTRÓNICA;ING. EMPRESARIAL;ING. FORESTAL;ING. INDUSTRIAL;ING. INFORMÁTICA;ING. MECATRÓNICA;ING. MECÁNICA;ING. QUÍMICA;ING. SANITARIA;LABORATORIO;LIMPIEZA;LITERATURA Y LINGUÍSTICA;MARKETING | PUBLICIDAD;MEDICINA;MEDICINA VETERINARIA;NEGOCIOS INTERNACIONALES;NUTRICIÓN;OBSTETRICIA;ODONTOLOGIA | DENTISTA;PERIODISMO;PSICOLOGÍA;RECURSOS HUMANOS;RELACIONES INTERNACIONALES;RELACIONES PÚBLICAS;SECRETARIA;SEGURIDAD | SERENAZGO;SOCIOLOGÍA;TOPOGRAFÍA;TRABAJO SOCIAL;TRADUCCIÓN E INTERPRETACIÓN;TURISMO | HOTELERIA;ZOOTECNIA | ING. ZOOTECNISTA".split(";");
var CON=["CAS","PRÁCTICAS","728","276","Servicio Civil","Locacion de Servicios","CONSULTORIA INDIVIDUAL"];
var DEP=["Lima","Amazonas","Ancash","Apurímac","Arequipa","Ayacucho","Cajamarca","Cusco","Callao","Huancavelica","Huánuco","Ica","Junín","La Libertad","Lambayeque","Loreto","Madre de Dios","Moquegua","Pasco","Piura","Puno","San Martín","Tacna","Tumbes","Ucayali"];
var NIV=["Personas con Primaria Completa","Personas con Secundaria Completa","Estudiantes Técnicos","Egresados Técnicos","Titulados Técnicos","Estudiantes Universitarios","Egresados Universitarios","Bachilleres","Titulado Universitarios","Estudios Pedagógicos","Miembros de las FF.AA. y PNP"];
var B="https://www.convocatoriasdetrabajo.com/oportunidad-laboral-";
var J=[],ACT="";
var $=function(s){return document.querySelector(s)},PS=4,pg=1,F={q:"",car:"",con:"",dep:"",niv:"",ord:"id"},saved={};
try{saved=JSON.parse(localStorage.getItem("ee_saved")||"{}")}catch(e){}
function opts(a,x){return '<option value="">Todos</option>'+a.map(function(i){return '<option'+(i===x?" selected":"")+'>'+i+'</option>'}).join("")}
function ini(s){return s.replace(/[^A-Za-z0-9 ]/g,"").split(" ").map(function(w){return w[0]}).join("").slice(0,3).toUpperCase()}
function dd(c){var a=new Date();a.setHours(0,0,0,0);return Math.round((new Date(c+"T00:00:00")-a)/864e5)}
function fd(c){return new Date(c+"T00:00:00").toLocaleDateString("es-PE",{day:"numeric",month:"long",year:"numeric"})}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function nrm(t){return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function sf(j){return j.s?'S/ '+j.s.toLocaleString('es-PE'):'Según bases'}
function pill(c){var n=dd(c);return n<0?'<span class="pill off">Convocatoria cerrada</span>':n===0?'<span class="pill">Finaliza hoy</span>':'<span class="pill '+(n>3?"ok":"")+'">Finaliza en '+n+(n===1?" día":" días")+'</span>'}
function sh(j){var e=encodeURIComponent(j.u),t=encodeURIComponent(j.t);return '<div class="share">Compartir <a href="https://www.facebook.com/share.php?u='+e+'" target="_blank" rel="noopener">f</a><a href="https://wa.me/?text='+t+'%20'+e+'" target="_blank" rel="noopener">W</a><a href="https://twitter.com/intent/tweet?url='+e+'&text='+t+'" target="_blank" rel="noopener">X</a><a href="https://www.linkedin.com/shareArticle?url='+e+'" target="_blank" rel="noopener">in</a></div>'}
function filt(){
 var q=F.q.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
 var a=J.filter(function(j){var h=(j.t+" "+j.r+" "+j.o).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  return (!q||h.indexOf(q)>-1)&&(!F.car||j.car.indexOf(F.car)>-1)&&(!F.con||nrm(j.k)===nrm(F.con))&&(!F.dep||j.d===F.dep)&&(!F.niv||j.niv.indexOf(F.niv)>-1)});
 a.sort(function(x,y){return F.ord==="sueldo"?y.s-x.s:F.ord==="cierre"?new Date(x.c)-new Date(y.c):y.id-x.id});return a}
function list(){
 var a=filt(),P=Math.max(1,Math.ceil(a.length/PS));if(pg>P)pg=P;
 $("#cnt").innerHTML='<span>'+a.length+'</span> vacantes del sector público'+(F.dep?' en '+F.dep:'');
 $("#items").innerHTML=a.length?a.slice((pg-1)*PS,pg*PS).map(function(j){return '<article class="job"><div class="jh"><div><div class="org"><div class="av">'+ini(j.o)+'</div><b>Convocatoria '+j.o+'</b></div></div><button class="bm'+(saved[j.id]?" on":"")+'" data-b="'+j.id+'" aria-label="Guardar convocatoria">'+(saved[j.id]?"★":"☆")+'</button></div>'+
 '<h2><a href="#" data-o="'+j.id+'">'+j.t+'</a></h2><p class="req">'+j.r+'</p>'+
 '<div class="tiles"><div class="t m"><small>Sueldo</small><b>'+sf(j)+'</b></div><div class="t"><small>Departamento</small><b>'+j.d+'</b></div><div class="t"><small>Vacantes</small><b>'+j.v+'</b></div><div class="t"><small>Contrato</small><b>'+j.k+'</b></div></div>'+
 '<div class="jf"><div>'+pill(j.c)+' <span style="font-size:.95rem;color:var(--mut)">Vigente hasta: '+fd(j.c)+'</span></div><a class="btn" href="#" data-o="'+j.id+'">Más información</a></div><div class="jf" style="margin-top:12px">'+sh(j)+'</div></article>'}).join(""):'<div class="empty"><b>No hay convocatorias con esos filtros.</b><br>Prueba con “Todos” en algún campo.</div>';
 var h="";for(var i=1;i<=P;i++)h+='<button class="'+(i===pg?"on":"")+'" data-p="'+i+'">'+i+'</button>';$("#pag").innerHTML=P>1?h:""}
function home(){
 $("#app").innerHTML='<div class="bc"><a data-home="1">Convocatorias de trabajo</a> › Buscar empleo</div><h1>Convocatorias de trabajo en el sector público</h1><p class="lead">Al ingresar a cada aviso verás un resumen del puesto y el enlace a las bases. Revisa los requisitos, condiciones del contrato, cronograma y cómo postular antes de enviar tu postulación.</p>'+
 '<section class="filters"><h3>Filtros avanzados</h3><div class="fg"><div><label for="fc">Carreras</label><select id="fc">'+opts(CAR,F.car)+'</select></div><div><label for="fk">Contrato</label><select id="fk">'+opts(CON,F.con)+'</select></div><div><label for="fd">Departamento</label><select id="fd">'+opts(DEP,F.dep)+'</select></div><div><label for="fn">Nivel de estudios</label><select id="fn">'+opts(NIV,F.niv)+'</select></div></div>'+
 '<div class="fr"><div class="s"><label for="fq">Buscar</label><input id="fq" value="'+F.q+'" placeholder="Puesto, entidad o palabra clave…"></div><div class="o"><label for="fo">Ordenar por</label><select id="fo"><option value="id">Más recientes</option><option value="cierre">Fecha de cierre (próximas)</option><option value="sueldo">Mayor remuneración</option></select></div><button class="btn" id="ap">Aplicar filtros</button><button class="btn g" id="cl">Limpiar</button></div></section>'+
 '<div class="layout"><div><div class="count" id="cnt"></div><div id="items"></div><div class="pag" id="pag"></div></div><aside class="side"><div class="sh"><i>💬</i><div><b>Empleos del Estado</b><small>Encuentra oportunidades en tu región</small></div></div>'+DEP.map(function(d){return '<a data-r="'+d+'">'+d+'<span>›</span></a>'}).join("")+'</aside></div>';
 $("#fo").value=F.ord;list()}
function det(id){
 var j=J.filter(function(x){return x.id===id})[0];if(!j){home();return}
 var R=j.raw,li=function(a){return a&&a.length?'<ul>'+a.map(function(i){return '<li>'+esc(i)+'</li>'}).join("")+'</ul>':''};
 var bases=R.bases&&R.bases.length?R.bases.map(function(b){return '<a class="dl" href="'+esc(b.url)+'" target="_blank" rel="noopener">'+(b.pdf?'📄 Abrir bases en PDF':/\.(xlsx?|docx?)(\?|$)/i.test(b.url)?'⬇ Descargar archivo':'📄 Abrir publicación oficial de las bases')+' · '+esc(b.texto)+'</a>'}).join(""):'<div class="note">Esta entidad aún no publicó un enlace a las bases en este aviso.</div>';
 var como=(R.como?'<p style="margin:0 0 8px">'+esc(R.como)+'</p>':'')+'<p style="margin:0 0 8px"><b>Plazo para postular:</b> hasta el '+fd(j.c)+'</p>'+(R.postular_url?'<a class="dl" href="'+esc(R.postular_url)+'" target="_blank" rel="noopener">POSTULA AQUÍ →</a>':'');
 $("#app").innerHTML='<div class="bc"><a href="#" data-home="1">Convocatorias de trabajo</a> › '+esc(j.t)+'</div><article class="d">'+pill(j.c)+'<div class="ent" style="margin-top:12px">Convocatoria '+esc(j.o)+'</div><h1>'+esc(j.t)+'</h1>'+sh(j)+
 '<div class="key"><h4>Clave del puesto</h4><div class="kg"><div>Plaza(s)<b>'+j.v+' disponible</b></div><div>Remuneración<b>'+sf(j)+'</b></div><div>Lugar de labores<b>'+esc(R.depto)+'</b></div><div>Plazo para postular<b>'+fd(j.c)+'</b></div></div></div>'+
 '<div class="sec"><h3>📋 Requisitos para el puesto</h3><div class="b">'+li(R.requisitos)+'<div class="note"><b>Nota:</b> descarga las bases para conocer los requisitos completos.</div></div></div>'+
 '<div class="sec"><h3>📄 Condiciones del contrato</h3><div class="b">'+li(R.condiciones)+'<ul><li><b>Régimen:</b> '+esc(j.k)+'</li></ul></div></div>'+
 '<div class="sec"><h3>🚀 ¿Cómo postular?</h3><div class="b">'+como+'</div></div>'+
 '<div class="sec"><h3>⬇️ Descarga aquí las bases</h3><div class="b">'+bases+'</div></div>'+
 '<div class="sec"><h3>📊 Resultados y comunicados</h3><div class="b">'+(R.comunicados_url?'<a class="dl" href="'+esc(R.comunicados_url)+'" target="_blank" rel="noopener">Ver comunicados y resultados de '+esc(j.o)+' →</a>':'Revisa el cronograma de las bases: allí se indica cuándo y por qué medio se publican los resultados.')+'</div></div>'+
 '<button class="btn g" data-home="1">← Volver a los resultados</button></article>';window.scrollTo(0,0)}
function go(h){h?det(+h):home()}
function route(){var m=(location.hash||'').match(/^#o(\d+)$/);try{m?det(+m[1]):home()}catch(e){home()}}
document.addEventListener("click",function(e){var t=e.target;
 var oo=t.closest&&t.closest('[data-o]');if(oo){e.preventDefault();det(+oo.getAttribute('data-o'));return}
 var hh=t.closest&&t.closest('[data-home]');if(hh){e.preventDefault();home();window.scrollTo(0,0);return}
 if(t.id==="ap"){F.car=$("#fc").value;F.con=$("#fk").value;F.dep=$("#fd").value;F.niv=$("#fn").value;F.ord=$("#fo").value;F.q=$("#fq").value.trim();pg=1;list()}
